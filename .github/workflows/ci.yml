name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint + test + benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pytest (53 unit + integration tests)
        run: pytest -v
      - name: Retrieval evaluation (real, measured precision@k / recall@k / MRR)
        run: python -m engineering_rag.cli evaluate
      - name: Benchmarks (indexing + query throughput, informational)
        run: pytest benchmarks/ --benchmark-only -v

  docker:
    name: docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t engineering-docs-rag:ci .
      - name: Smoke test -- demo (default CMD)
        run: docker run --rm engineering-docs-rag:ci
      - name: Smoke test -- query
        run: |
          docker run --rm engineering-docs-rag:ci query "What is the set pressure of the pressure relief valve?" --top-k 1
      - name: Smoke test -- evaluate
        run: docker run --rm engineering-docs-rag:ci evaluate
